name: VPN Server
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: vpn
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        id: cfg
        run: |
          UUID="03cd926d-0f4b-4de2-916c-c9ecc7296680"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip && rm Xray-linux-64.zip
          chmod +x xray
          python3 -c "
          import json
          c={
            'log':{'loglevel':'warning'},
            'inbounds':[{'port':10000,'protocol':'vless','settings':{'clients':[{'id':'$UUID'}],'decryption':'none'},'streamSettings':{'network':'tcp'}}],
            'outbounds':[{'protocol':'freedom'}]
          }
          json.dump(c,open('cfg.json','w'))
          "
          ./xray run -c cfg.json > xray.log 2>&1 &
          for i in $(seq 1 5); do
            ss -tlnp | grep -q 10000 && break
            sleep 1
          done

      - name: Tunnel
        id: tunnel
        run: |
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.2/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore
          ./bore local 10000 --to bore.pub > bore.log 2>&1 &
          for i in $(seq 1 30); do
            PORT=$(grep -oP 'bore\.pub:\K\d+' bore.log | head -1 || true)
            [ -n "$PORT" ] && break
            sleep 2
          done
          echo "port=${PORT:-}" >> $GITHUB_OUTPUT
          cat bore.log
          if [ -n "$PORT" ]; then
            echo "tunnel: bore.pub:$PORT"
          else
            echo "FAILED to get bore port" >&2
          fi

      - name: Diagnose
        run: |
          echo "=== xray ==="
          ps aux | grep -v grep | grep xray || echo "xray not found"
          echo "=== bore ==="
          ps aux | grep -v grep | grep bore || echo "bore not found"
          echo "=== bore log ==="
          tail -10 bore.log || true
          echo "=== xray log ==="
          tail -10 xray.log || true

      - name: Publish link
        env:
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          PORT="${{ steps.tunnel.outputs.port }}"
          ID="${{ steps.cfg.outputs.uuid }}"
          LINK="vless://$ID@bore.pub:$PORT?encryption=none&security=none&type=tcp#VPN-GHA"
          echo "$LINK" > vless-link.txt
          echo -n "$LINK" | base64 -w0 > sub.txt
          for FILE in vless-link.txt sub.txt; do
            SHA=$(curl -sf -H "Authorization: token $TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" \
              | jq -r .sha 2>/dev/null || true)
            B64=$(base64 -w0 < "$FILE")
            if [ -n "$SHA" ]; then
              curl -sf -X PUT -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"update $FILE\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE"
            else
              curl -sf -X PUT -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"add $FILE\",\"content\":\"$B64\"}" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE"
            fi
          done
          echo "VPN ready!"
          echo "Manual: $LINK" >> $GITHUB_STEP_SUMMARY
          echo "Sub: https://raw.githubusercontent.com/${{ github.repository }}/main/sub.txt" >> $GITHUB_STEP_SUMMARY

      - name: Alive
        env:
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TUN_PORT: ${{ steps.tunnel.outputs.port }}
        shell: bash
        run: |
          set +e
          UUID="03cd926d-0f4b-4de2-916c-c9ecc7296680"
          CUR_PORT="$TUN_PORT"
          publish_link() {
            P="$1"
            LINK="vless://$UUID@bore.pub:$P?encryption=none&security=none&type=tcp#VPN-GHA"
            echo "$LINK" > vless-link.txt
            echo -n "$LINK" | base64 -w0 > sub.txt
            for FILE in vless-link.txt sub.txt; do
              SHA=$(curl -sf -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" \
                | jq -r .sha 2>/dev/null || true)
              B64=$(base64 -w0 < "$FILE")
              if [ -n "$SHA" ]; then
                curl -sf -X PUT -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"message\":\"update $FILE\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" > /dev/null 2>&1
              else
                curl -sf -X PUT -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"message\":\"add $FILE\",\"content\":\"$B64\"}" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" > /dev/null 2>&1
              fi
            done
            echo "VLESS: $LINK" >> $GITHUB_STEP_SUMMARY
          }
          restart_bore() {
            echo "[$(date)] bore restarting..."
            pkill -f 'bore local' 2>/dev/null || true
            sleep 2
            ./bore local 10000 --to bore.pub > bore.log 2>&1 &
            for i in $(seq 1 30); do
              NEWPORT=$(grep -oP 'bore\.pub:\K\d+' bore.log | head -1 || true)
              [ -n "$NEWPORT" ] && break
              sleep 2
            done
            if [ -n "$NEWPORT" ]; then
              echo "[$(date)] new tunnel: bore.pub:$NEWPORT"
              CUR_PORT="$NEWPORT"
              publish_link "$NEWPORT"
            fi
          }
          while true; do
            if ! curl -so /dev/null --connect-timeout 5 --max-time 10 http://localhost:10000 2>/dev/null; then
              echo "[$(date)] xray not responding, restarting..."
              pkill -f 'xray run' 2>/dev/null || true
              sleep 1
              ./xray run -c cfg.json > xray.log 2>&1 &
              for i in $(seq 1 10); do
                curl -so /dev/null --connect-timeout 2 http://localhost:10000 2>/dev/null && break
                sleep 1
              done
            fi
            if ! pgrep -f 'bore local' > /dev/null; then
              echo "[$(date)] bore not running, restarting..."
              restart_bore
            fi
            sleep 15
          done
