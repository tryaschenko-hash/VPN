name: VPN Server
on: [workflow_dispatch]

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Setup
        id: cfg
        run: |
          UUID="03cd926d-0f4b-4de2-916c-c9ecc7296680"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip && rm Xray-linux-64.zip
          chmod +x xray
          python3 -c "
          import json
          c={
            'log':{'loglevel':'warning'},
            'inbounds':[{'port':10000,'protocol':'vless','settings':{'clients':[{'id':'$UUID','encryption':'none'}],'decryption':'none'},'streamSettings':{'network':'ws','wsSettings':{'path':'/'}}}],
            'outbounds':[{'protocol':'freedom'}]
          }
          json.dump(c,open('cfg.json','w'))
          "
          ./xray run -c cfg.json &
          sleep 2

      - name: Tunnel
        id: tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          ./cloudflared-linux-amd64 tunnel --url http://localhost:10000 --no-autoupdate > cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Result
        run: |
          URL="${{ steps.tunnel.outputs.url }}"
          UUID="${{ steps.cfg.outputs.uuid }}"
          echo "## VPN Server Running" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "vless://$UUID@${URL#https://}:443?encryption=none&security=tls&type=ws&path=%2F#VPN-GHA" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "URL: $URL" >> $GITHUB_STEP_SUMMARY
          echo "UUID: $UUID" >> $GITHUB_STEP_SUMMARY
          echo "Timeout: 6 hours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copy VLESS link above into your client."

      - name: Alive
        run: |
          echo "VPN running at ${{ steps.tunnel.outputs.url }}"
          sleep 21600
