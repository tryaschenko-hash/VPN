name: VPN Server
on: [workflow_dispatch]

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        id: cfg
        run: |
          UUID="03cd926d-0f4b-4de2-916c-c9ecc7296680"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip && rm Xray-linux-64.zip
          chmod +x xray
          python3 -c "
          import json
          c={
            'log':{'loglevel':'warning'},
            'inbounds':[{'port':10000,'protocol':'vless','settings':{'clients':[{'id':'$UUID'}]},'streamSettings':{'network':'ws','wsSettings':{'path':'/'}}}],
            'outbounds':[{'protocol':'freedom'}]
          }
          json.dump(c,open('cfg.json','w'))
          "
          ./xray run -c cfg.json > xray.log 2>&1 &
          for i in $(seq 1 5); do
            ss -tlnp | grep -q 10000 && break
            sleep 1
          done

      - name: Tunnel
        id: tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          ./cloudflared-linux-amd64 tunnel --url http://localhost:10000 --no-autoupdate > cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oPm1 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "url=${URL:-}" >> $GITHUB_OUTPUT

      - name: Publish link
        run: |
          U="${{ steps.tunnel.outputs.url }}"
          ID="${{ steps.cfg.outputs.uuid }}"
          LINK="vless://$ID@${U#https://}:443?encryption=none&security=tls&type=ws&path=%2F#VPN-GHA"
          echo "$LINK" > vless-link.txt
          SHA=$(gh api repos/${{ github.repository }}/contents/vless-link.txt 2>/dev/null | jq -r .sha 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/${{ github.repository }}/contents/vless-link.txt \
              -f message="update vless link" \
              -f content="$(echo -n "$LINK" | base64 -w0)" \
              -f sha="$SHA"
          else
            gh api -X PUT repos/${{ github.repository }}/contents/vless-link.txt \
              -f message="add vless link" \
              -f content="$(echo -n "$LINK" | base64 -w0)"
          fi
          echo "VPN ready! VLESS link saved to vless-link.txt"
          echo "VLESS: $LINK" >> $GITHUB_STEP_SUMMARY

      - name: Alive
        run: sleep 21600
