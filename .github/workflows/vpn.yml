name: VPN Server
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: vpn
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        id: cfg
        run: |
          UUID="03cd926d-0f4b-4de2-916c-c9ecc7296680"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip && rm Xray-linux-64.zip
          chmod +x xray
          python3 -c "
import json
c={
  'log':{'loglevel':'warning'},
  'inbounds':[{
    'port':10000,'protocol':'vless',
    'settings':{'clients':[{'id':'$UUID'}],'decryption':'none'},
    'sniffing':{'enabled':True,'destOverride':['http','tls','quic']},
    'streamSettings':{'network':'ws','wsSettings':{'path':'/api'}},
    'sockopt':{'tcpKeepAliveIdle':30,'tcpKeepAliveInterval':10}
  }],
  'outbounds':[{
    'protocol':'freedom',
    'settings':{'domainStrategy':'UseIP'},
    'sockopt':{'tcpKeepAliveIdle':30,'tcpKeepAliveInterval':10}
  }],
  'dns':{
    'servers':[
      {'address':'8.8.8.8','port':53},
      {'address':'1.1.1.1','port':53},
      'localhost'
    ]
  },
  'routing':{
    'domainStrategy':'IPIfNonMatch',
    'rules':[
      {'type':'field','ip':['geoip:private'],'outboundTag':'blocked'},
      {'type':'field','protocol':['bittorrent'],'outboundTag':'blocked'}
    ]
  }
}
json.dump(c,open('cfg.json','w'))
"
          ./xray run -c cfg.json > xray.log 2>&1 &
          for i in $(seq 1 10); do
            ss -tlnp | grep -q 10000 && break
            sleep 1
          done

      - name: Tunnel
        id: tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          ./cloudflared-linux-amd64 tunnel --url http://localhost:10000 --no-autoupdate --heartbeat-interval 10s > cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oPm1 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "url=${URL:-}" >> $GITHUB_OUTPUT

      - name: Diagnose
        run: |
          echo "=== xray ==="
          ss -tlnp | grep 10000 || echo "xray NOT listening on 10000"
          ps aux | grep xray || echo "xray process not found"
          echo "=== internet ==="
          curl -so /dev/null --connect-timeout 5 -w "google.com: %{http_code}\n" https://www.google.com || echo "google.com: FAIL"
          curl -so /dev/null --connect-timeout 5 -w "cloudflare.com: %{http_code}\n" https://www.cloudflare.com || echo "cloudflare.com: FAIL"
          echo "=== dns ==="
          nslookup google.com 8.8.8.8 || echo "dns FAIL"
          echo "=== cloudflared ==="
          tail -5 cf.log || true
          echo "=== xray log ==="
          tail -20 xray.log || true

      - name: Publish link
        env:
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          U="${{ steps.tunnel.outputs.url }}"
          ID="${{ steps.cfg.outputs.uuid }}"
          LINK="vless://$ID@${U#https://}:443?encryption=none&security=tls&type=ws&path=%2Fapi#VPN-GHA"
          echo "$LINK" > vless-link.txt
          echo -n "$LINK" | base64 -w0 > sub.txt
          for FILE in vless-link.txt sub.txt; do
            SHA=$(curl -sf -H "Authorization: token $TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" \
              | jq -r .sha 2>/dev/null || true)
            B64=$(base64 -w0 < "$FILE")
            if [ -n "$SHA" ]; then
              curl -sf -X PUT -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"update $FILE\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE"
            else
              curl -sf -X PUT -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"add $FILE\",\"content\":\"$B64\"}" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE"
            fi
          done
          echo "VPN ready!"
          echo "Manual: $LINK" >> $GITHUB_STEP_SUMMARY
          echo "Sub: https://raw.githubusercontent.com/${{ github.repository }}/main/sub.txt" >> $GITHUB_STEP_SUMMARY

      - name: Alive
        env:
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          URL: ${{ steps.tunnel.outputs.url }}
        shell: bash
        run: |
          set +e
          UUID="03cd926d-0f4b-4de2-916c-c9ecc7296680"
          PUB_URL="$URL"
          COUNT=0
          publish_link() {
            U="$1"
            LINK="vless://$UUID@${U#https://}:443?encryption=none&security=tls&type=ws&path=%2Fapi#VPN-GHA"
            echo "$LINK" > vless-link.txt
            echo -n "$LINK" | base64 -w0 > sub.txt
            for FILE in vless-link.txt sub.txt; do
              SHA=$(curl -sf -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" \
                | jq -r .sha 2>/dev/null || true)
              B64=$(base64 -w0 < "$FILE")
              if [ -n "$SHA" ]; then
                curl -sf -X PUT -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"message\":\"update $FILE\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" > /dev/null 2>&1
              else
                curl -sf -X PUT -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"message\":\"add $FILE\",\"content\":\"$B64\"}" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" > /dev/null 2>&1
              fi
            done
            echo "VLESS: $LINK" >> $GITHUB_STEP_SUMMARY
          }
          restart_tunnel() {
            echo "[$(date)] tunnel restarting..."
            pkill -f cloudflared 2>/dev/null || true
            sleep 2
            ./cloudflared-linux-amd64 tunnel --url http://localhost:10000 --no-autoupdate --heartbeat-interval 10s > cf.log 2>&1 &
            for i in $(seq 1 30); do
              NEWURL=$(grep -oPm1 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log || true)
              [ -n "$NEWURL" ] && break
              sleep 2
            done
            if [ -n "$NEWURL" ]; then
              echo "[$(date)] new tunnel: $NEWURL"
              PUB_URL="$NEWURL"
              publish_link "$NEWURL"
            fi
          }
          while true; do
            if ! curl -so /dev/null --connect-timeout 5 --max-time 10 http://localhost:10000 2>/dev/null; then
              echo "[$(date)] xray not responding, restarting..."
              pkill -f 'xray run' 2>/dev/null || true
              sleep 1
              ./xray run -c cfg.json > xray.log 2>&1 &
              for i in $(seq 1 10); do
                curl -so /dev/null --connect-timeout 2 http://localhost:10000 2>/dev/null && break
                sleep 1
              done
            fi
            if ! pgrep -f cloudflared > /dev/null; then
              echo "[$(date)] cloudflared missing, restarting..."
              restart_tunnel
            else
              # check tunnel health
              CODE=$(curl -so /dev/null --connect-timeout 15 --max-time 20 -w '%{http_code}' "$PUB_URL" 2>/dev/null || true)
              if [ "$CODE" = "530" ] || [ -z "$CODE" ]; then
                echo "[$(date)] tunnel broken (530), restarting..."
                restart_tunnel
              fi
            fi
            # test xray proxying every 30 cycles (~7.5 min)
            if [ $((COUNT % 30)) -eq 0 ]; then
              echo "[$(date)] proxy test: $(curl -so /dev/null --connect-timeout 10 --max-time 15 -w '%{http_code}' https://www.google.com 2>/dev/null || echo FAIL)"
            fi
            # generate background traffic every 60s to keep connection alive
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge 4 ]; then
              COUNT=0
              curl -so /dev/null --connect-timeout 10 "$PUB_URL" 2>/dev/null &
            fi
            sleep 15
          done
