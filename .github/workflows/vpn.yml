name: VPN Server
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: vpn
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        id: cfg
        run: |
          UUID="03cd926d-0f4b-4de2-916c-c9ecc7296680"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip && rm Xray-linux-64.zip
          chmod +x xray
          python3 -c "
          import json
          c={
            'log':{'loglevel':'info'},
            'dns':{'servers':['https+local://1.1.1.1/dns-query','https+local://8.8.8.8/dns-query','localhost'],'queryStrategy':'UseIP'},
            'inbounds':[{'port':10000,'protocol':'vless','settings':{'clients':[{'id':'$UUID'}],'decryption':'none'},'sniffing':{'enabled':True,'destOverride':['http','tls']},'streamSettings':{'network':'ws','wsSettings':{'path':'/'}}}],
            'outbounds':[{'protocol':'freedom','settings':{'domainStrategy':'UseIP'}}]
          }
          json.dump(c,open('cfg.json','w'))
          "
          ./xray run -c cfg.json > xray.log 2>&1 &
          for i in $(seq 1 5); do
            ss -tlnp | grep -q 10000 && break
            sleep 1
          done

      - name: Tunnel
        id: tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          ./cloudflared-linux-amd64 tunnel --url http://localhost:10000 --no-autoupdate > cf.log 2>&1 &
          for i in $(seq 1 30); do
            URL=$(grep -oPm1 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "url=${URL:-}" >> $GITHUB_OUTPUT

      - name: Diagnose
        run: |
          echo "=== xray log ==="
          tail -20 xray.log || true
          echo "=== xray process ==="
          ps aux | grep xray || true
          echo "=== cloudflared log ==="
          tail -5 cf.log || true
          echo "=== test tunnel ==="
          curl -svo /dev/null --connect-timeout 10 "${{ steps.tunnel.outputs.url }}" 2>&1 || true

      - name: Publish link
        env:
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          U="${{ steps.tunnel.outputs.url }}"
          ID="${{ steps.cfg.outputs.uuid }}"
          LINK="vless://$ID@${U#https://}:443?encryption=none&security=tls&type=ws&path=%2F#VPN-GHA"
          echo "$LINK" > vless-link.txt
          # standard v2ray subscription: one URI per line, base64-encoded
          echo -n "$LINK" | base64 -w0 > sub.txt
          for FILE in vless-link.txt sub.txt; do
            SHA=$(curl -sf -H "Authorization: token $TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" \
              | jq -r .sha 2>/dev/null || true)
            B64=$(base64 -w0 < "$FILE")
            if [ -n "$SHA" ]; then
              curl -sf -X PUT -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"update $FILE\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE"
            else
              curl -sf -X PUT -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"message\":\"add $FILE\",\"content\":\"$B64\"}" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE"
            fi
          done
          echo "VPN ready! Links saved."
          echo "Manual: $LINK" >> $GITHUB_STEP_SUMMARY
          echo "Sub: https://raw.githubusercontent.com/${{ github.repository }}/main/sub.txt" >> $GITHUB_STEP_SUMMARY

      - name: Alive
        env:
          TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          UUID="03cd926d-0f4b-4de2-916c-c9ecc7296680"
          PUBLISHED_URL="$URL"
          publish_link() {
            U="$1"
            LINK="vless://$UUID@${U#https://}:443?encryption=none&security=tls&type=ws&path=%2F#VPN-GHA"
            echo "$LINK" > vless-link.txt
            echo -n "$LINK" | base64 -w0 > sub.txt
            for FILE in vless-link.txt sub.txt; do
              SHA=$(curl -sf -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" \
                | jq -r .sha 2>/dev/null || true)
              B64=$(base64 -w0 < "$FILE")
              if [ -n "$SHA" ]; then
                curl -sf -X PUT -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"message\":\"update $FILE\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" > /dev/null 2>&1
              else
                curl -sf -X PUT -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"message\":\"add $FILE\",\"content\":\"$B64\"}" \
                  "https://api.github.com/repos/${{ github.repository }}/contents/$FILE" > /dev/null 2>&1
              fi
            done
            echo "VLESS: $LINK" >> $GITHUB_STEP_SUMMARY
          }
          restart_cloudflared() {
            echo "[$(date)] cloudflared restarting..."
            pkill -f cloudflared 2>/dev/null || true
            sleep 1
            ./cloudflared-linux-amd64 tunnel --url http://localhost:10000 --no-autoupdate > cf.log 2>&1 &
            for i in $(seq 1 30); do
              NEWURL=$(grep -oPm1 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log || true)
              [ -n "$NEWURL" ] && break
              sleep 2
            done
            if [ -n "$NEWURL" ]; then
              echo "[$(date)] new tunnel: $NEWURL"
              PUBLISHED_URL="$NEWURL"
              publish_link "$NEWURL"
            fi
          }
          while true; do
            if ! pgrep -f 'xray run' > /dev/null; then
              echo "[$(date)] xray died, restarting..."
              ./xray run -c cfg.json > xray.log 2>&1 &
              sleep 2
            fi
            if ! curl -sfo /dev/null --connect-timeout 15 --max-time 20 "$PUBLISHED_URL" 2>/dev/null; then
              echo "[$(date)] tunnel not responding, restarting..."
              restart_cloudflared
            elif ! pgrep -f cloudflared > /dev/null; then
              echo "[$(date)] cloudflared process missing, restarting..."
              restart_cloudflared
            fi
            sleep 30
          done
